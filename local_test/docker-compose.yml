services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LAMBDA_TASK_ROOT=/app/generate_pdf
    volumes:
      - ../src/generate_pdf:/app/generate_pdf:ro
      - ./book_pdf_exporter_local.py:/app/generate_pdf/book_pdf_exporter.py:ro
      - ./run_local_pipeline.py:/app/run_local_pipeline.py:ro
      - ./structured_schemas.py:/app/structured_schemas.py:ro
      - ./chart_material.py:/app/chart_material.py:ro
      - ./chart_coverage.py:/app/chart_coverage.py:ro
      - ./pipeline_config.json:/app/pipeline_config.json:ro
      - ./.env:/app/.env:ro
      - ./output:/app/output
    command: ["run_local_pipeline.py"]

  batch-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LAMBDA_TASK_ROOT=/app/generate_pdf
      # Default: structured chapter_focus+notes (+ chart_coverage soft checks).
      # Client path-hydrate experiment:
      #   CHAPTER_MATERIAL_MODE=freeform
      #   (or FREEFORM_CHAPTER_MATERIAL=1)
      # Architect selects source_paths; Python copies records from astrology_data.
    volumes:
      - ../src/generate_pdf:/app/generate_pdf:ro
      - ./book_pdf_exporter_local.py:/app/generate_pdf/book_pdf_exporter.py:ro
      - ./run_local_batch_pipeline.py:/app/run_local_batch_pipeline.py:ro
      - ./test_openai_batch_smoke.py:/app/test_openai_batch_smoke.py:ro
      - ./test_chapters_paragraphs.py:/app/test_chapters_paragraphs.py:ro
      - ./structured_schemas.py:/app/structured_schemas.py:ro
      - ./chart_material.py:/app/chart_material.py:ro
      - ./chart_coverage.py:/app/chart_coverage.py:ro
      - ./pipeline_config.json:/app/pipeline_config.json:ro
      - ./.env:/app/.env:ro
      - ./output:/app/output
    command: ["run_local_batch_pipeline.py"]

  batch-images-from-artifacts:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../src/generate_pdf:/app/generate_pdf:ro
      - ./book_pdf_exporter_local.py:/app/generate_pdf/book_pdf_exporter.py:ro
      - ./run_local_batch_pipeline.py:/app/run_local_batch_pipeline.py:ro
      - ./structured_schemas.py:/app/structured_schemas.py:ro
      - ./chart_material.py:/app/chart_material.py:ro
      - ./chart_coverage.py:/app/chart_coverage.py:ro
      - ./run_local_batch_images_from_artifacts.py:/app/run_local_batch_images_from_artifacts.py:ro
      - ./.env:/app/.env:ro
      - ./output:/app/output
    command: ["run_local_batch_images_from_artifacts.py"]

  generate-cover:
    build:
      context: .
      dockerfile: Dockerfile.generate_cover
    env_file:
      - .env
    environment:
      - LAMBDA_TASK_ROOT=/app/generate_cover
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      - USE_LEGACY_COVER_LAYOUT=${USE_LEGACY_COVER_LAYOUT:-0}
      - PAGE_COUNT=${PAGE_COUNT:-220}
      - LULU_POD_PACKAGE_ID=${LULU_POD_PACKAGE_ID:-0550X0850.BW.STD.LW.060UC444.MNG}
      - LULU_API_BASE=${LULU_API_BASE:-https://api.lulu.com}
    volumes:
      - ../src/generate_cover:/app/generate_cover:ro
      - ./run_generate_cover_local.py:/app/run_generate_cover_local.py:ro
      - ./cover_art_local.py:/app/cover_art_local.py:ro
      - ./pipeline_config.json:/app/pipeline_config.json:ro
      - ./output:/app/output
    command: ["run_generate_cover_local.py"]

  pdf-from-artifacts:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LAMBDA_TASK_ROOT=/app/generate_pdf
    volumes:
      - ../src/generate_pdf:/app/generate_pdf:ro
      - ./book_pdf_exporter_local.py:/app/generate_pdf/book_pdf_exporter.py:ro
      - ./run_pdf_from_artifacts.py:/app/run_pdf_from_artifacts.py:ro
      - ./pipeline_config.json:/app/pipeline_config.json:ro
      - ./output:/app/output
    command: ["run_pdf_from_artifacts.py"]
